name: Main
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    types:
      - completed
    workflows:
      - "Update WIT"

permissions:
  contents: write
  pull-requests: write

jobs:
  main:
    name: Build, test, and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Java/Kotlin
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Tools
        uses: actions/cache@v6
        with:
          path: tools
          key: ${{ runner.os }}-${{ runner.arch }}-tools

      - name: Build example plugin to test
        run: |
          ./gradlew build --no-daemon
